<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MultiEvidence demo</title>
<style>body{font:16px system-ui;max-width:860px;margin:2rem auto;padding:0 1rem;line-height:1.45}label{display:block;margin:.8rem 0}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:.5rem}button{padding:.6rem 1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f3f3;padding:1rem}img,video{max-width:100%;max-height:220px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.card{border:1px solid #ccc;padding:.8rem;overflow-wrap:anywhere}section{margin:1.5rem 0}</style>
<h1>MultiEvidence</h1>
<p>Check one claim against local media or find public multimedia evidence automatically.</p>
<form id="form">
<label>Mode<select name="mode" id="mode"><option value="manual">Manual media</option><option value="auto">Auto retrieve</option></select></label>
<label>Claim<textarea name="claim" required>The road remains open.</textarea></label>
<label>Topic<input name="topic" value="Road conditions" required></label>
<div id="manual-fields"><label>Media path on server<input name="path" placeholder="./data/media/example.mp4"></label><label>Type<select name="type"><option>image</option><option>video</option></select></label><label>Source name<input name="source" placeholder="Optional"></label></div>
<div id="auto-fields" hidden><label>Published after (optional)<input name="published_after" type="date"></label></div>
<button id="submit">Check evidence</button>
</form>
<section id="progress" aria-live="polite"></section><section id="queries"></section><section id="candidates"></section><section id="evidence"></section><section id="summary"></section>
<details><summary>Full JSON response</summary><pre id="result"></pre></details>
<script>
const mode=document.querySelector('#mode'),form=document.querySelector('#form');
const areas=Object.fromEntries(['progress','queries','candidates','evidence','summary','result'].map(id=>[id,document.getElementById(id)]));
mode.addEventListener('change',()=>{const auto=mode.value==='auto';document.querySelector('#manual-fields').hidden=auto;document.querySelector('#auto-fields').hidden=!auto;document.querySelector('#submit').textContent=auto?'Find and check new multimedia evidence':'Check evidence'});
function heading(value){const h=document.createElement('h2');h.textContent=value;return h}
function line(value){const p=document.createElement('p');p.textContent=value;return p}
function preview(url,type,alt){const element=document.createElement(type==='video'?'video':'img');element.src=url;element.alt=alt||'';if(type==='video'){element.controls=true;element.preload='metadata'}return element}
function source(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open source';return a}
function showManual(data){areas.summary.append(heading(`${data.relation} (${Math.round(data.confidence*100)}%)`),line(data.explanation),line(`Suggested update: ${data.suggested_update.action} — ${data.suggested_update.new_text}`));const cards=document.createElement('div');cards.className='cards';for(const item of data.evidence){const card=document.createElement('div');card.className='card';card.append(line(`${item.timestamp_seconds??'Image'}: ${item.observation}`),preview(item.frame_url,'image',item.observation));cards.append(card)}areas.evidence.append(cards)}
function showAuto(data){areas.progress.append(heading('Progress'),line(`Retrieved: ${data.articles_considered} articles, ${data.media_candidates} media candidates`),line(`Filtered: ${data.filtered_candidates} candidates`),line(`Verified: ${data.verified_evidence_count} useful evidence items`));areas.queries.append(heading('Search queries'));const list=document.createElement('ul');for(const query of data.queries){const li=document.createElement('li');li.textContent=query;list.append(li)}areas.queries.append(list);areas.candidates.append(heading('Candidate media'));const previews=document.createElement('div');previews.className='cards';for(const item of data.candidate_previews){const card=document.createElement('div');card.className='card';card.append(preview(item.media_url,item.media_type,item.title),line(item.title),source(item.source_url));previews.append(card)}areas.candidates.append(previews);areas.evidence.append(heading('Verified evidence'));const cards=document.createElement('div');cards.className='cards';for(const item of data.evidence){const card=document.createElement('div');card.className='card';card.append(line(`${item.relation} · ${Math.round(item.confidence*100)}%`),line(`${item.source_name} · ${item.published_at||'Date unavailable'}`),preview(item.frame_url||item.media_url,'image',item.observation),line(item.observation));if(item.timestamp_seconds!==null)card.append(line(`Video timestamp: ${item.timestamp_seconds}s`));card.append(source(item.source_url));cards.append(card)}areas.evidence.append(cards);areas.summary.append(heading(`Claim status: ${data.claim_status} (${Math.round(data.confidence*100)}%)`),line(`Suggested update: ${data.suggested_update.action} — ${data.suggested_update.new_text}`));if(data.message)areas.summary.append(line(data.message))}
form.addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#submit');button.disabled=true;for(const area of Object.values(areas))area.replaceChildren();areas.progress.textContent='Checking…';const f=new FormData(form),base={report_id:'demo',topic:f.get('topic'),claim:{claim_id:'demo_claim',text:f.get('claim')}},auto=mode.value==='auto';const body=auto?{...base,search:{published_after:f.get('published_after')||null}}:{...base,evidence:[{evidence_id:'demo_evidence',type:f.get('type'),local_path:f.get('path'),source_name:f.get('source')||null}]};const endpoint=auto?'/api/v1/multimodal/search-and-check':'/api/v1/multimodal/check-evidence';try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await response.json();areas.result.textContent=JSON.stringify(data,null,2);areas.progress.replaceChildren();if(!response.ok){areas.progress.append(line(`Request failed (${response.status})`));const detail=data.detail||data;areas.summary.append(line(typeof detail==='string'?detail:detail.message||JSON.stringify(detail)));return}if(auto)showAuto(data);else showManual(data)}catch(error){areas.progress.replaceChildren();areas.progress.append(line(`Request failed: ${error.message||String(error)}`))}finally{button.disabled=false;if(areas.progress.textContent==='Checking…')areas.progress.replaceChildren()}});
</script>
</html>
